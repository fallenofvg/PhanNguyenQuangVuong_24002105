<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2 - Danh mục sản phẩm bằng component</title>
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 20px; }
        h1 { text-align: center; color: #333; }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #fff;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-image { position: relative; text-align: center; }
        .card-image img { width: 100%; height: 160px; object-fit: cover; border-radius: 4px; }
        .badge-out {
            position: absolute;
            top: 8px; right: 8px;
            background-color: #dc3545;
            color: #fff;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            font-weight: bold;
        }
        .card-body h3 { margin: 10px 0 5px; font-size: 18px; }
        .price { color: #e44d26; font-weight: bold; font-size: 16px; margin: 5px 0; }
        .stock { color: #666; font-size: 14px; margin: 5px 0; }
        .btn-toggle {
            background-color: #17a2b8;
            color: white; border: none;
            padding: 6px 10px; border-radius: 4px;
            cursor: pointer; margin-top: 8px; width: 100%;
        }
        .btn-buy {
            background-color: #28a745;
            color: white; border: none;
            padding: 8px 12px; border-radius: 4px;
            cursor: pointer; margin-top: 10px; width: 100%; font-size: 15px;
        }
        .btn-buy:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
            opacity: 0.65;
        }
        .description {
            background-color: #f8f9fa;
            border-left: 3px solid #17a2b8;
            padding: 8px; margin-top: 8px;
            font-size: 13px; color: #555;
        }
    </style>
</head>
<body>

    <div id="app">
        <h1>DANH MỤC SẢN PHẨM</h1>
        
        <div class="product-grid">
            <!-- Yêu cầu 4: Truyền dữ liệu từ cha xuống con bằng cú pháp binding v-bind (:) -->
            <the-san-pham 
                v-for="item in products" 
                :key="item.id"
                :ten="item.ten"
                :gia="item.gia"
                :anh="item.anh"
                :mo-ta="item.moTa"
                :so-luong-ton="item.soLuongTon">
            </the-san-pham>
        </div>
    </div>

    <!-- Sử dụng module để nạp file .js độc lập (Yêu cầu 8) -->
    <script type="module">
        import TheSanPham from './components/TheSanPham.js';

        const { createApp } = Vue;

        const app = createApp({
            data() {
                return {
                    // Yêu cầu 1: Quản lý danh sách ít nhất 4 sản phẩm
                    products: [
                        {
                            id: 1,
                            ten: 'iPhone 15 Pro Max',
                            gia: 29990000,
                            anh: 'https://picsum.photos/id/1/300/200',
                            moTa: 'Màn hình Super Retina XDR 6.7 inch, chip A17 Pro mạnh mẽ.',
                            soLuongTon: 10
                        },
                        {
                            id: 2,
                            ten: 'MacBook Air M3',
                            gia: 27990000,
                            anh: 'https://picsum.photos/id/0/300/200',
                            moTa: 'Thiết kế siêu mỏng nhẹ, pin sử dụng lên đến 18 giờ.',
                            soLuongTon: 0 // Hết hàng (Yêu cầu 7)
                        },
                        {
                            id: 3,
                            ten: 'Bàn phím cơ Bluetooth',
                            gia: 1450000,
                            anh: 'https://picsum.photos/id/60/300/200',
                            moTa: 'Switch cơ học gõ êm, kết nối đa thiết bị.',
                            soLuongTon: 15
                        },
                        {
                            id: 4,
                            ten: 'Chuột không dây Silent',
                            gia: 450000,
                            // Không truyền ảnh và mô tả để kiểm tra prop mặc định
                            soLuongTon: 5
                        }
                    ]
                }
            }
        });

        // Yêu cầu 8: Nạp và đăng ký component trước khi mount
        app.component('the-san-pham', TheSanPham);

        app.mount('#app');
    </script>
</body>
</html>
